blueprint:
  name: Pillbox – intake reminder
  description: >-
    Reminds you of a Pillbox intake (e.g. "Vitamin D Morning") from a given time while
    its switch is off, and repeats the reminder until an end time.
    Phone notifications (mobile_app) get a "Taken" button that checks off the intake
    directly. Create one automation per intake.
  domain: automation
  source_url: https://github.com/FdyFox/pillbox/blob/main/blueprints/automation/pillbox/intake_reminder.yaml
  input:
    intake_switch:
      name: Intake
      description: Switch of the intake, e.g. switch.vitamin_d_morning
      selector:
        entity:
          filter:
            - integration: pillbox
              domain: switch
    time_weekday:
      name: Remind from (Mon–Fri)
      default: "08:00:00"
      selector:
        time: {}
    time_weekend:
      name: Remind from (Sat–Sun)
      default: "10:00:00"
      selector:
        time: {}
    notify_action:
      name: Notify action
      description: e.g. notify.mobile_app_phone
      selector:
        text: {}
    repeat_minutes:
      name: Repeat every … minutes
      description: 0 = remind only once
      default: 60
      selector:
        number:
          min: 0
          max: 240
          step: 5
          unit_of_measurement: min
          mode: box
    last_reminder:
      name: Last reminder at
      default: "22:00:00"
      selector:
        time: {}
    title:
      name: Title
      default: "{{ medication }}"
      selector:
        text: {}
    message:
      name: Message
      default: "{{ intake }}: not taken yet."
      selector:
        text: {}
    button_title:
      name: Button text
      description: Text of the button in phone notifications that checks off the intake
      default: Taken
      selector:
        text: {}

mode: parallel
max: 5

trigger_variables:
  switch_entity: !input intake_switch

triggers:
  - trigger: time
    at: !input time_weekday
    id: weekday
  - trigger: time
    at: !input time_weekend
    id: weekend
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: "PILLBOX_{{ switch_entity }}"
    id: take

variables:
  notify_action: !input notify_action
  repeat_minutes: !input repeat_minutes
  last_reminder: !input last_reminder
  medication: "{{ state_attr(switch_entity, 'medication') or device_attr(device_id(switch_entity), 'name') }}"
  intake: "{{ state_attr(switch_entity, 'intake') }}"
  action_id: "PILLBOX_{{ switch_entity }}"
  button_title: !input button_title
  is_mobile_app: "{{ notify_action.startswith('notify.mobile_app_') }}"

conditions:
  - condition: or
    conditions:
      - condition: trigger
        id: take
      - condition: and
        conditions:
          - condition: trigger
            id: weekday
          - condition: time
            weekday: [mon, tue, wed, thu, fri]
          - condition: state
            entity_id: !input intake_switch
            state: "off"
      - condition: and
        conditions:
          - condition: trigger
            id: weekend
          - condition: time
            weekday: [sat, sun]
          - condition: state
            entity_id: !input intake_switch
            state: "off"

actions:
  - if:
      - condition: trigger
        id: take
    then:
      - action: switch.turn_on
        target:
          entity_id: !input intake_switch
    else:
      - repeat:
          while:
            - condition: state
              entity_id: !input intake_switch
              state: "off"
            - condition: template
              value_template: "{{ repeat.index == 1 or repeat_minutes | int(0) > 0 }}"
            - condition: template
              value_template: "{{ now().strftime('%H:%M:%S') < last_reminder }}"
          sequence:
            - action: !input notify_action
              data:
                title: !input title
                message: !input message
                data: >-
                  {{ {'tag': action_id, 'actions': [{'action': action_id, 'title': button_title}]}
                     if is_mobile_app else {} }}
            - if:
                - condition: template
                  value_template: "{{ repeat_minutes | int(0) > 0 }}"
              then:
                - wait_for_trigger:
                    - trigger: state
                      entity_id: !input intake_switch
                      to: "on"
                  timeout:
                    minutes: "{{ repeat_minutes | int }}"
      # Done -> remove the reminder from the phone.
      - if:
          - condition: state
            entity_id: !input intake_switch
            state: "on"
          - condition: template
            value_template: "{{ is_mobile_app }}"
        then:
          - action: !input notify_action
            data:
              message: clear_notification
              data:
                tag: "{{ action_id }}"
